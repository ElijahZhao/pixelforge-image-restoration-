name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (train unit + API smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt -r requirements-dev.lock.txt
          pip install pytest-cov

      - name: Run test suite (with coverage gate)
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=75

      - name: Run train/ unit tests (offline runner, skips on missing deps)
        # `pytest` above already collects train/tests via pyproject testpaths, but
        # this explicit step runs the project's own runner (python -m train.tests.run_tests)
        # so training-logic regressions surface under a clearly-labelled gate, and
        # offline runs skip (not fail) on checks needing a network download.
        run: python -m train.tests.run_tests

  audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # Audits the lock file, so the checked set matches what actually ships.
      # If a CVE has no fix yet, add it to .pip-audit-ignore with a reason
      # instead of dropping the check.
      - name: Audit locked runtime dependencies
        run: pip-audit -r requirements.lock.txt

  frontend:
    name: frontend build (tsc + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  paper:
    name: paper assets (tables, facts, public release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.lock.txt

      # The paper's tables are generated from the result CSVs and checked
      # against FACTS.md. If a number in the source data changes without the
      # table being regenerated, this job fails -- which is the point: a
      # table that disagrees with the data it claims to summarise must not
      # reach a reader.
      - name: Regenerate tables and check they agree with FACTS.md
        run: |
          python3.11 scripts/make_tables.py
          git diff --exit-code -- paper/tables/

      - name: Check Table 1 (seven nearest neighbours) against refs.bib
        run: |
          python3.11 scripts/make_table1.py
          git diff --exit-code -- paper/tables/table1_neighbours.

      # FACTS.md is the paper's source of truth. Its errata table must stay
      # contiguous and structurally valid, or the record stops being readable.
      - name: Check FACTS.md structure
        run: python3.11 scripts/check_facts_structure.py

      # The public per-image release must reproduce every reported cell.
      # This is the promise the Data Availability statement makes.
      - name: Check the public per-image release reproduces the reported cells
        run: |
          python3.11 scripts/build_public_release.py --check
          python3.11 scripts/verify_public_release.py
