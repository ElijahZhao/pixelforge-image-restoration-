name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (train unit + API smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt -r requirements-dev.lock.txt
          pip install pytest-cov

      - name: Run test suite (with coverage gate)
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=75

      - name: Run train/ unit tests (offline runner, skips on missing deps)
        # `pytest` above already collects train/tests via pyproject testpaths, but
        # this explicit step runs the project's own runner (python -m train.tests.run_tests)
        # so training-logic regressions surface under a clearly-labelled gate, and
        # offline runs skip (not fail) on checks needing a network download.
        run: python -m train.tests.run_tests

  audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # Audits the lock file, so the checked set matches what actually ships.
      # If a CVE has no fix yet, add it to .pip-audit-ignore with a reason
      # instead of dropping the check.
      - name: Audit locked runtime dependencies
        run: pip-audit -r requirements.lock.txt

  frontend:
    name: frontend build (tsc + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  paper:
    name: paper assets (tables, facts, public release)
    runs-on: ubuntu-latest
    # The bibliography audit resolves 24 arXiv records and two DOIs over the
    # network, with retries and backoff when a registry throttles: about
    # 4.5 minutes on a good connection, considerably longer on a slow one.
    # Installing the toolchain adds another ~2.5 minutes. A 15-minute cap
    # left too little headroom, and a timeout would be indistinguishable
    # from a real failure.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.lock.txt

      # The manuscript is compiled for real, so the job needs a LaTeX
      # toolchain. texlive-latex-recommended plus texlive-latex-extra
      # covers booktabs, multirow, microtype and the rest of the preamble.
      - name: Install the LaTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended
          # poppler-utils provides pdfinfo, pdftotext and pdftohtml, which
          # the layout check uses to measure the PDF that was just built.
          sudo apt-get install -y -qq --no-install-recommends poppler-utils

      # The paper's tables are generated from the result CSVs and checked
      # against FACTS.md. If a number in the source data changes without the
      # table being regenerated, this job fails -- which is the point: a
      # table that disagrees with the data it claims to summarise must not
      # reach a reader.
      - name: Regenerate tables and check they agree with FACTS.md
        run: |
          python3.11 scripts/make_tables.py
          git diff --exit-code -- paper/tables/

      - name: Check Table 1 (seven nearest neighbours) against refs.bib
        run: |
          python3.11 scripts/make_table1.py
          git diff --exit-code -- paper/tables/table1_neighbours.

      # refs.bib is generated from the arXiv API, not written by hand, so it
      # can be rebuilt and compared. A mismatch means either the API
      # returned something different this time or the file was edited
      # outside the generator.
      #
      # The comparison uses diff(1), not git diff --no-index: the rebuild
      # lands in /tmp, which is outside the checkout, and `git diff --no-index`
      # with a path outside the repository fails with "is outside repository"
      # rather than comparing anything. An earlier version of this step put
      # `--no-index` after `--`, where it was parsed as a pathspec, and the
      # job failed on every run while the two files were in fact identical.
      #
      # Exit 2 from the generator means arXiv never answered, which is not
      # evidence that refs.bib is stale, so it is reported as inconclusive.
      - name: Rebuild refs.bib from the arXiv API and check it agrees
        run: |
          set +e
          python3.11 scripts/build_refs_bib.py --out /tmp/refs_rebuilt.bib
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::arXiv was unreachable, so refs.bib could not be rebuilt (inconclusive)."
            exit 0
          elif [ "$code" -ne 0 ]; then
            echo "::error::The refs.bib rebuild failed (exit $code)."
            exit 1
          fi
          if ! diff -u paper/refs.bib /tmp/refs_rebuilt.bib; then
            echo "::error::refs.bib differs from the generator output."
            echo "::error::Regenerate it with: python3.11 scripts/build_refs_bib.py --out paper/refs.bib"
            exit 1
          fi

      # FACTS.md is the paper's source of truth. Its errata table must stay
      # contiguous and structurally valid, or the record stops being readable.
      - name: Check FACTS.md structure
        run: python3.11 scripts/check_facts_structure.py

      # The public per-image release must reproduce every reported cell.
      # This is the promise the Data Availability statement makes.
      - name: Check the public per-image release reproduces the reported cells
        run: |
          python3.11 scripts/build_public_release.py --check
          python3.11 scripts/verify_public_release.py

      # The manuscript is checked the same way: it must compile, and every
      # number in its prose must be traceable to FACTS.md or to the
      # generated tables. A number nobody can source is a number nobody can
      # check.
      - name: Build the manuscript
        run: |
          cd paper
          pdflatex -interaction=nonstopmode main.tex
          bibtex main
          pdflatex -interaction=nonstopmode main.tex
          pdflatex -interaction=nonstopmode main.tex
          # A LaTeX error must fail the job, and so must an unresolved
          # reference or a box that runs past the margin.
          ! grep -qE "^! " main.log
          ! grep -qi "undefined" main.log
          ! grep -q "Overfull" main.log

      - name: Check the manuscript's numbers against FACTS.md
        run: python3.11 scripts/check_manuscript_numbers.py

      - name: Check the manuscript's prose against the generated tables
        run: python3.11 scripts/check_prose_against_tables.py

      # The submission archive must be self-sufficient: the platform asks
      # for "all files necessary, including the .bib file, to recreate the
      # PDF". The script proves it by unpacking the archive and compiling
      # it in isolation, with no access to the rest of the repository.
      - name: Build and verify the submission archive
        run: python3.11 scripts/make_submission_package.py

      # A manuscript can be numerically perfect and still be unreadable:
      # a table scaled to 4.6 pt, a float that lands before the sentence
      # referring to it, a table file the archive carries but the
      # manuscript never uses. None of these produce a LaTeX error, so
      # they are checked by measuring the PDF.
      - name: Check the manuscript's layout
        run: python3.11 scripts/check_layout.py

      # A second, independent derivation of the headline numbers.
      #
      # Every other gate checks that the manuscript agrees with FACTS.md and
      # with the generated tables. That is a consistency check: if FACTS.md
      # and the tables both drift together, every gate still passes. These two
      # scripts re-derive the numbers from the raw protocol_matrix.json and
      # from the released per-image CSVs, importing nothing from scripts/, so
      # they can contradict the project's own pipeline. They found two real
      # defects that the consistency gates could not see (E86: a table label
      # whose sign was the opposite of its number; E87: three P1 seed sigmas
      # described as "P1 and P2 respectively").
      - name: Independent re-derivation of the headline numbers
        run: |
          python3.11 scripts/audit_independent.py
          python3.11 scripts/audit_per_image.py

      # Every reference must be a real, resolvable work whose registered
      # title matches the one in refs.bib. The script fetches all 24 arXiv
      # ids, compares titles and years, resolves both DOIs through
      # Crossref and doi.org, and checks that every \cite key in the
      # manuscript exists and every entry is cited.
      #
      # It reaches the network, so it is a separate step: a registry being
      # briefly unreachable must not be reported as a broken citation.
      # The script therefore distinguishes the two outcomes -- exit 1 means
      # a reference really failed, exit 2 means the registry never answered
      # and the check did not run at all. Only exit 1 fails the job; exit 2
      # is reported as inconclusive, because a transient outage of arXiv or
      # Crossref says nothing about the manuscript.
      - name: Audit the bibliography
        continue-on-error: false
        run: |
          set +e
          python3.11 scripts/check_references.py
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::The bibliography audit could not reach the registry (exit 2)."
            echo "::warning::The references were not verified in this run; the step is inconclusive, not failed."
          elif [ "$code" -ne 0 ]; then
            echo "::error::The bibliography audit found a problem (exit $code)."
            exit 1
          fi
