# PixelForge · 复古像素 / 游戏风主题（Streamlit 官方主题层）
# 配合 streamlit_app.py 注入的 CSS 使用，形成"像素街机"整体观感。

[theme]
base = "dark"
primaryColor = "#22d3ee"            # 霓虹青 —— 按钮 / 选中态
backgroundColor = "#0b0a1f"         # 深空紫背景
secondaryBackgroundColor = "#171338" # 卡片 / 侧栏
textColor = "#e8e6ff"
font = "monospace"                   # 全局等宽字体，像素感基座

[client]
toolbarMode = "minimal"              # 收起右上角工具栏，减少框架感

[browser]
gatherUsageStats = false
